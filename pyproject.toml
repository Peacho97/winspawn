[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "winspawn"
version = "0.1.0"
description = "Hidden-by-default background process spawning on Windows, plus a source auditor."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keaton Van Patten" }]
keywords = ["windows", "subprocess", "console", "hidden", "audit"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Peacho97/winspawn"
Repository = "https://github.com/Peacho97/winspawn"

[project.scripts]
winspawn = "winspawn:main"

[tool.setuptools]
py-modules = ["winspawn"]
